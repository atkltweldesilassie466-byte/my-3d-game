<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D DLS Style Football Kick</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    #score-board {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 30px;
      border-radius: 20px;
      font-size: 22px;
      font-weight: bold;
      border: 2px solid #00ffcc;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="score-board">GOALS: <span id="goals" style="color:#00ffcc;">0</span></div>
  <div id="instructions">Press <b>SPACEBAR</b> to Shoot the Ball!</div>

  <script>
    // 1. Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Light
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10, 20, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x666666));

    // 2. Pitch (Grass Ground)
    const pitchGeo = new THREE.PlaneGeometry(60, 100);
    const pitchMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
    const pitch = new THREE.Mesh(pitchGeo, pitchMat);
    pitch.rotation.x = -Math.PI / 2;
    scene.add(pitch);

    // 3. Goal Post (ሜዳው መጨረሻ ላይ ያለ የግብ መረብ)
    const goalGroup = new THREE.Group();
    const postMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    
    // Top Bar
    const topBar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 12), postMat);
    topBar.rotation.z = Math.PI / 2;
    topBar.position.set(0, 4, -40);
    goalGroup.add(topBar);

    // Left & Right Posts
    const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4), postMat);
    leftPost.position.set(-6, 2, -40);
    goalGroup.add(leftPost);

    const rightPost = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4), postMat);
    rightPost.position.set(6, 2, -40);
    goalGroup.add(rightPost);

    scene.add(goalGroup);

    // 4. Goalkeeper (ግብ ጠባቂ)
    const keeperGeo = new THREE.BoxGeometry(1.5, 3, 1);
    const keeperMat = new THREE.MeshLambertMaterial({ color: 0xff0055 });
    const keeper = new THREE.Mesh(keeperGeo, keeperMat);
    keeper.position.set(0, 1.5, -39);
    scene.add(keeper);

    // 5. Football (ኳስ)
    const ballGeo = new THREE.SphereGeometry(0.6, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.position.set(0, 0.6, 0);
    scene.add(ball);

    // Camera Position (ከኳሷ ጀርባ)
    camera.position.set(0, 3, 7);
    camera.lookAt(0, 2, -40);

    // 6. Game Logic & Controls
    let isMoving = false;
    let ballSpeedZ = 0;
    let ballSpeedY = 0;
    let ballSpeedX = 0;
    let goals = 0;
    let keeperDirection = 1;

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isMoving) {
        isMoving = true;
        ballSpeedZ = -0.8;
        ballSpeedY = 0.12 + Math.random() * 0.08;
        ballSpeedX = (Math.random() - 0.5) * 0.3; // Random direction
      }
    });

    function resetBall() {
      ball.position.set(0, 0.6, 0);
      isMoving = false;
    }

    function animate() {
      requestAnimationFrame(animate);

      // Keeper Move Left/Right
      keeper.position.x += 0.08 * keeperDirection;
      if (keeper.position.x > 4.5 || keeper.position.x < -4.5) {
        keeperDirection *= -1;
      }

      // Ball Movement when Kicked
      if (isMoving) {
        ball.position.z += ballSpeedZ;
        ball.position.y += ballSpeedY;
        ball.position.x += ballSpeedX;
        ball.rotation.x -= 0.1;

        // Check Collision with Keeper
        const distToKeeper = ball.position.distanceTo(keeper.position);
        if (distToKeeper < 1.5) {
          alert('Saved by the Keeper! 🧤 Try Again.');
          resetBall();
        }

        // Check Goal
        if (ball.position.z <= -40) {
          if (Math.abs(ball.position.x) < 5.8 && ball.position.y < 4) {
            goals++;
            document.getElementById('goals').innerText = goals;
            alert('GOAAAAAL! ⚽🔥');
          } else {
            alert('Missed! Out of Target.');
          }
          resetBall();
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
