<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saddam Shop Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Header -->
    <header class="bg-emerald-600 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">Saddam Shop <span class="text-xs font-normal bg-emerald-800 px-2 py-0.5 rounded-full ml-1">Delivery</span></h1>
                <p class="text-xs text-emerald-100"><i class="fa-solid fa-phone mr-1"></i> To place an order: <a href="tel:0935911623" class="underline font-bold">0935911623</a></p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openCart()" class="relative bg-emerald-700 hover:bg-emerald-800 p-2.5 rounded-full text-white transition">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="openAdminModal()" class="bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center">
                    <i class="fa-solid fa-user-lock mr-1.5"></i> Shop Owner
                </button>
            </div>
        </div>
        <!-- Search Bar -->
        <div class="max-w-6xl mx-auto px-4 pb-3">
            <div class="relative">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search items here (e.g., sugar, oil)..." class="w-full pl-10 pr-4 py-2 rounded-xl text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-300 shadow-inner">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-800 border-l-4 border-emerald-600 pl-3">Our Products</h2>
            <span class="text-xs text-gray-500" id="itemCountDisplay">15 items available</span>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- JS dynamic content -->
        </div>
    </main>

    <!-- Cart / Delivery Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 bg-emerald-600 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-basket-shopping mr-2"></i>Selected Items</h3>
                <button onclick="closeCart()" class="text-white hover:text-gray-200 text-xl font-bold">&times;</button>
            </div>
            
            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Cart items list -->
            </div>

            <div class="p-4 border-t bg-gray-50 space-y-3">
                <div class="flex justify-between font-bold text-lg">
                    <span>Total Price:</span>
                    <span id="cartTotal" class="text-emerald-600">0 Birr</span>
                </div>

                <!-- Customer Delivery Form -->
                <div class="space-y-2 pt-2 border-t border-gray-200">
                    <h4 class="text-xs font-bold text-gray-600 uppercase tracking-wider">Delivery Address (Required)</h4>
                    <input type="text" id="custName" placeholder="Full Name" class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-emerald-500">
                    <input type="tel" id="custPhone" placeholder="Phone Number (e.g., 0911...)" class="w-full p-2 border rounded text-sm focus:ring-1 focus:ring-emerald-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="custBlock" placeholder="Block Number" class="p-2 border rounded text-sm focus:ring-1 focus:ring-emerald-500">
                        <input type="text" id="custHouse" placeholder="House Number" class="p-2 border rounded text-sm focus:ring-1 focus:ring-emerald-500">
                    </div>
                </div>

                <button onclick="placeOrder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Order by Phone (0935911623)</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Admin Authentication Modal -->
    <div id="adminAuthModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
            <button onclick="closeAdminAuthModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-lg">&times;</button>
            <h3 class="text-xl font-bold text-center text-emerald-700 mb-4"><i class="fa-solid fa-lock mr-2"></i>Shop Owner Login</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-600 font-semibold">Username</label>
                    <input type="text" id="adminUser" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-600 font-semibold">Password</label>
                    <input type="password" id="adminPass" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <p id="adminAuthError" class="text-red-500 text-xs hidden text-center">Invalid Username or Password!</p>
                <button onclick="verifyAdmin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold transition">Login</button>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="adminDashboardModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl relative overflow-hidden">
            <div class="p-4 bg-emerald-700 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-sliders mr-2"></i>Shop Management (Admin Dashboard)</h3>
                <button onclick="closeAdminDashboard()" class="text-white hover:text-gray-200 text-xl font-bold">&times;</button>
            </div>

            <div class="p-4 overflow-y-auto space-y-6">
                <!-- Add Product Form -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <h4 class="font-bold text-sm text-gray-700 mb-3"><i class="fa-solid fa-plus-circle text-emerald-600 mr-1"></i>Add New Item</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <input type="text" id="newProdName" placeholder="Item Name" class="p-2 border rounded text-sm">
                        <input type="number" id="newProdPrice" placeholder="Price (in Birr)" class="p-2 border rounded text-sm">
                        <input type="text" id="newProdImage" placeholder="Image URL (Optional)" class="p-2 border rounded text-sm">
                    </div>
                    <button onclick="addNewProduct()" class="mt-3 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-bold">Add Item</button>
                </div>

                <!-- Existing Products List -->
                <div>
                    <h4 class="font-bold text-sm text-gray-700 mb-3"><i class="fa-solid fa-list text-emerald-600 mr-1"></i>Manage Existing Items</h4>
                    <div id="adminProductList" class="space-y-2">
                        <!-- Admin products injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initial Products List
        const defaultProducts = [
            { id: 1, name: "Sugar", price: 200, img: "https://images.unsplash.com/photo-1581441363689-1f3c3c414635?w=300" },
            { id: 2, name: "Rice", price: 150, img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300" },
            { id: 3, name: "Macaroni", price: 190, img: "https://images.unsplash.com/photo-1621996346565-e3d5d6281288?w=300" },
            { id: 4, name: "Wheat Flour", price: 150, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" },
            { id: 5, name: "2L Bottled Water", price: 60, img: "https://images.unsplash.com/photo-1548839140-29a749e1bc4e?w=300" },
            { id: 6, name: "Eggs", price: 24, img: "https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=300" },
            { id: 7, name: "Injera", price: 30, img: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=300" },
            { id: 8, name: "Sun Chips", price: 40, img: "https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=300" },
            { id: 9, name: "Omo Detergent (Small)", price: 750, img: "https://images.unsplash.com/photo-1585842378054-ee2e52f94ba2?w=300" },
            { id: 10, name: "Omo Detergent (Large)", price: 1800, img: "https://images.unsplash.com/photo-1585842378054-ee2e52f94ba2?w=300" },
            { id: 11, name: "Cooking Oil", price: 2000, img: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=300" },
            { id: 12, name: "Tissue Paper", price: 80, img: "https://images.unsplash.com/photo-1584556812952-905ffd0c611a?w=300" },
            { id: 13, name: "Wet Wipes", price: 140, img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=300" },
            { id: 14, name: "Soft Drink (Pepsi/Coca)", price: 70, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300" },
            { id: 15, name: "Soap", price: 50, img: "https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=300" }
        ];

        let products = JSON.parse(localStorage.getItem('sadam_products')) || defaultProducts;
        let cart = [];

        function saveProducts() {
            localStorage.setItem('sadam_products', JSON.stringify(products));
        }

        function renderProducts(items = products) {
            const grid = document.getElementById('productGrid');
            document.getElementById('itemCountDisplay').innerText = `${items.length} items available`;
            grid.innerHTML = '';

            items.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                        <img src="${p.img}" alt="${p.name}" class="w-full h-32 object-cover bg-gray-100">
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm">${p.name}</h3>
                                <p class="text-emerald-600 font-extrabold text-base mt-1">${p.price} <span class="text-xs text-gray-500 font-normal">Birr</span></p>
                            </div>
                            <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white border border-emerald-200 hover:border-transparent py-1.5 rounded-xl font-bold text-xs transition flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-plus"></i>
                                <span>Add to Cart</span>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(q));
            renderProducts(filtered);
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const exist = cart.find(c => c.id === id);
            if (exist) {
                exist.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            cartCount.innerText = totalQty;
            cartTotal.innerText = totalPrice + " Birr";

            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="text-center text-gray-400 py-10">Your cart is empty!</p>`;
                return;
            }

            cartItems.innerHTML = '';
            cart.forEach(item => {
                cartItems.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl">
                        <div>
                            <p class="font-bold text-sm">${item.name}</p>
                            <p class="text-xs text-emerald-600 font-bold">${item.price} Birr x ${item.qty} = ${item.price * item.qty} Birr</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded text-sm font-bold flex items-center justify-center">-</button>
                            <span class="text-sm font-bold">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-emerald-600 text-white rounded text-sm font-bold flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCartUI();
        }

        function openCart() { document.getElementById('cartModal').classList.remove('hidden'); }
        function closeCart() { document.getElementById('cartModal').classList.add('hidden'); }

        function placeOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const block = document.getElementById('custBlock').value.trim();
            const house = document.getElementById('custHouse').value.trim();

            if (cart.length === 0) {
                alert("Please select at least one item first!");
                return;
            }
            if (!name || !phone || !block || !house) {
                alert("Please fill in your full name, phone number, block number, and house number!");
                return;
            }

            let orderText = `*Saddam Shop - New Order*\n`;
            orderText += `Customer: ${name}\nPhone: ${phone}\nBlock: ${block} | House No: ${house}\n\n*Ordered Items:*\n`;
            cart.forEach(c => {
                orderText += `- ${c.name} (${c.qty}x) = ${c.price * c.qty} Birr\n`;
            });
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            orderText += `\n*Total Price:* ${total} Birr`;

            window.location.href = `tel:0935911623`;
            alert("Your order is ready! Please confirm your address and items on the call.\n\n" + orderText);
        }

        // Admin Functionality
        function openAdminModal() { document.getElementById('adminAuthModal').classList.remove('hidden'); }
        function closeAdminAuthModal() { document.getElementById('adminAuthModal').classList.add('hidden'); }

        function verifyAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            if (user === 'sadam' && pass === '2119') {
                document.getElementById('adminAuthError').classList.add('hidden');
                closeAdminAuthModal();
                openAdminDashboard();
            } else {
                document.getElementById('adminAuthError').classList.remove('hidden');
            }
        }

        function openAdminDashboard() {
            document.getElementById('adminDashboardModal').classList.remove('hidden');
            renderAdminProductList();
        }
        function closeAdminDashboard() { document.getElementById('adminDashboardModal').classList.add('hidden'); }

        function renderAdminProductList() {
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-100 p-2 rounded-lg text-sm">
                        <span class="font-bold w-1/3">${p.name}</span>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="price-input-${p.id}" value="${p.price}" class="w-20 p-1 border rounded text-center font-bold">
                            <button onclick="updatePrice(${p.id})" class="bg-blue-600 text-white px-2 py-1 rounded text-xs font-bold">Update</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-500 text-white px-2 py-1 rounded text-xs font-bold">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function updatePrice(id) {
            const newPrice = parseFloat(document.getElementById(`price-input-${id}`).value);
            if (newPrice > 0) {
                const prod = products.find(p => p.id === id);
                if (prod) {
                    prod.price = newPrice;
                    saveProducts();
                    renderProducts();
                    alert(`${prod.name} price updated to ${newPrice} Birr!`);
                }
            }
        }

        function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this item?")) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                renderProducts();
                renderAdminProductList();
            }
        }

        function addNewProduct() {
            const name = document.getElementById('newProdName').value.trim();
            const price = parseFloat(document.getElementById('newProdPrice').value);
            const img = document.getElementById('newProdImage').value.trim() || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=300';

            if (!name || isNaN(price)) {
                alert("Please enter a valid item name and price!");
                return;
            }

            const newId = Date.now();
            products.push({ id: newId, name, price, img });
            saveProducts();
            renderProducts();
            renderAdminProductList();

            document.getElementById('newProdName').value = '';
            document.getElementById('newProdPrice').value = '';
            document.getElementById('newProdImage').value = '';
            alert("New item added successfully!");
        }

        // Init
        renderProducts();
    </script>
</body>
</html>
